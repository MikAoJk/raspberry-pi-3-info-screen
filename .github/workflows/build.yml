name: build
on:
  push

permissions:
  packages: "write"
  contents: "write"
  id-token: "write"
  security-events: "write"
  checks: "write"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test
  build:
    if: github.actor != 'dependabot[bot]'
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build
      - name: Audit dependencies
        id: audit
        continue-on-error: true
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Add audit vulnerabilities to job summary
        if: ${{ always() }}
        env:
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
        run: |
          {
            echo '## Dependency audit'
            if [ "$AUDIT_OUTCOME" = 'success' ]; then
              echo 'No vulnerabilities or warnings found.'
            else
              cargo audit --json > audit.json || true
              jq -r '
                .vulnerabilities.list[] |
                "### [\(.advisory.id)](https://rustsec.org/advisories/\(.advisory.id).html)\n\n\(.advisory.title)\n\n- Package: `\(.package.name)` `\(.package.version)`\n- Patched versions: `\(.versions.patched | join(", "))`\n\n\(.advisory.description)\n"
              ' audit.json
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$AUDIT_OUTCOME" = 'success' ] }}
      - name: Check formatting
        run: cargo fmt -- --check
      - name: Run Clippy
        run: cargo clippy --release --all-targets -- -D warnings
      
