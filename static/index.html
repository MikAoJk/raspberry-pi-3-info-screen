<!doctype html>
<html lang="no">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Info Screen</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: Arial, sans-serif;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #101216;
            color: #ffffff;
        }

        main {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            padding: 32px;
            min-height: 100vh;
        }

        .card {
            background: #1b1f27;
            border-radius: 16px;
            padding: 24px;
            min-width: 0;
        }

        .weather-card {
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .calendar-card {
            grid-column: 1 / -1;
        }

        .calendar-card {
            min-height: 0;
        }

        #events {
            min-height: 0;
        }

        #clock {
            font-size: 8rem;
            font-weight: bold;
        }

        #date {
            color: #aab2c0;
            font-size: 1.5rem;
        }

        h2 {
            margin-top: 0;
        }

        #events {
            display: grid;
            gap: 16px;
            margin-top: 18px;
        }

        .week-grid {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
            gap: 14px;
        }

        .day-group {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 12px;
            min-width: 0;
        }

        .day-header {
            font-size: 0.95rem;
            font-weight: bold;
            color: #dfe7f4;
            margin-bottom: 10px;
            text-transform: capitalize;
        }

        .day-events {
            display: grid;
            gap: 10px;
        }

        .no-events {
            color: #aab2c0;
            font-size: 0.9rem;
            font-style: italic;
        }

        #weather-summary {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            font-size: 1.1rem;
        }

        #weather-icon {
            font-size: 2rem;
        }

        #hourly-weather {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
            margin-top: 16px;
            min-height: 0;
        }

        .weather-day {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 12px;
        }

        .weather-day-header {
            color: #dfe7f4;
            font-size: 1rem;
            font-weight: bold;
            margin-bottom: 10px;
            text-transform: capitalize;
        }

        .weather-day-forecasts {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 8px;
        }

        .forecast-item {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 10px;
            padding: 12px 8px;
            text-align: center;
        }

        .forecast-item .icon {
            font-size: 1.75rem;
            margin-bottom: 6px;
        }

        .forecast-item .time {
            color: #aab2c0;
            font-size: 0.9rem;
        }

        .forecast-item .temp {
            font-size: 1.25rem;
            font-weight: bold;
        }

        .event {
            background: rgba(255, 255, 255, 0.04);
            border-left: 6px solid #4f8cff;
            border-radius: 12px;
            padding: 16px 18px;
            display: grid;
            gap: 6px;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.04);
        }

        .event strong {
            font-size: 1.2rem;
            line-height: 1.3;
            overflow-wrap: anywhere;
        }

        .event-time {
            color: #aab2c0;
            font-size: 1rem;
        }

        .auth-prompt {
            display: grid;
            gap: 14px;
            padding: 18px;
            border-radius: 12px;
            background: rgba(79, 140, 255, 0.08);
            border: 1px solid rgba(79, 140, 255, 0.2);
        }

        .auth-prompt p {
            margin: 0;
            color: #dfe7f4;
            line-height: 1.5;
        }

        button {
            background: #4f8cff;
            border: 0;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            padding: 12px 18px;
            font-size: 1rem;
        }

        @media (max-width: 1200px) {
            main {
                gap: 16px;
                padding: 20px;
            }

            .card {
                padding: 20px;
            }

            .week-grid {
                grid-template-columns: repeat(3, minmax(0, 1fr));
                gap: 12px;
            }

            .day-group {
                padding: 14px;
            }

            .event {
                padding: 14px 16px;
            }
        }

        @media (min-width: 801px) and (max-height: 700px) {
            body {
                overflow: hidden;
            }

            main {
                height: 100vh;
                grid-template-rows: minmax(0, 0.9fr) minmax(0, 1.4fr);
                gap: 14px;
                padding: 14px;
            }

            .card {
                border-radius: 12px;
                padding: 14px;
                overflow: hidden;
            }

            #clock {
                font-size: clamp(4rem, 11vh, 5.5rem);
                line-height: 1;
            }

            #date {
                font-size: 1.1rem;
            }

            h2 {
                margin-bottom: 10px;
            }

            #weather-summary {
                gap: 8px;
                margin-bottom: 8px;
                font-size: 1rem;
            }

            #weather-icon {
                font-size: 1.6rem;
            }

            #hourly-weather {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 6px;
                margin-top: 8px;
            }

            .weather-day {
                padding: 8px;
            }

            .weather-day-header {
                font-size: 0.8rem;
                margin-bottom: 6px;
            }

            .weather-day-forecasts {
                gap: 4px;
            }

            .forecast-item {
                padding: 6px 4px;
            }

            .forecast-item .icon {
                font-size: 1.2rem;
                margin-bottom: 2px;
            }

            .forecast-item .time {
                font-size: 0.7rem;
            }

            .forecast-item .temp {
                font-size: 0.95rem;
            }

            #events {
                height: calc(100% - 34px);
                overflow: auto;
                margin-top: 10px;
            }

            .week-grid {
                height: 100%;
                gap: 8px;
            }

            .day-group {
                padding: 8px;
                overflow: hidden;
            }

            .day-header {
                font-size: 0.8rem;
                margin-bottom: 6px;
            }

            .day-events {
                gap: 6px;
                overflow: auto;
            }

            .event {
                border-left-width: 4px;
                border-radius: 8px;
                padding: 8px 10px;
                gap: 3px;
            }

            .event strong {
                font-size: 0.95rem;
                line-height: 1.2;
            }

            .event-time,
            .no-events {
                font-size: 0.75rem;
            }
        }

        @media (max-width: 800px) {
            main {
                grid-template-columns: 1fr;
            }

            #clock {
                font-size: 4rem;
            }

            .week-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .event strong {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
<main>
    <section class="card">
        <div id="clock">--:--</div>
        <div id="date">Laster Klokke...</div>
    </section>

    <section class="card weather-card">
        <h2>Vær</h2>
        <div id="weather-summary">
            <div id="weather-icon">--</div>
            <div id="weather">Laster været...</div>
        </div>
        <div id="hourly-weather"></div>
    </section>

    <section class="card calendar-card">
        <h2>Google Kalender</h2>
        <div id="events">Laster kalender...</div>
    </section>
</main>

<script>
    function updateClock() {
        const now = new Date();

        document.getElementById("clock").textContent =
            now.toLocaleTimeString([], {
                hour: "2-digit",
                minute: "2-digit",
                hour12: false
            });

        document.getElementById("date").textContent =
            now.toLocaleDateString("no-NO", {
                weekday: "long",
                year: "numeric",
                month: "long",
                day: "numeric"
            });
    }

    function renderWeather(snapshot) {
        document.getElementById("weather-icon").textContent = snapshot.icon || "☀️";
        document.getElementById("weather").textContent = snapshot.description || "Nå: --°C";

        const container = document.getElementById("hourly-weather");
        container.innerHTML = "";

        const hourly = snapshot.hourly || [];
        const dailyForecasts = new Map();
        const currentDay = new Date();
        currentDay.setHours(0, 0, 0, 0);
        const nextDay = new Date(currentDay);
        nextDay.setDate(nextDay.getDate() + 1);
        const displayedDays = new Set([
            `${currentDay.getFullYear()}-${currentDay.getMonth()}-${currentDay.getDate()}`,
            `${nextDay.getFullYear()}-${nextDay.getMonth()}-${nextDay.getDate()}`
        ]);

        for (const entry of hourly) {
            const date = new Date(entry.time);
            const dateKey = `${date.getFullYear()}-${date.getMonth()}-${date.getDate()}`;
            if (!displayedDays.has(dateKey)) {
                continue;
            }
            const forecast = dailyForecasts.get(dateKey) || {
                date,
                entries: []
            };
            forecast.entries.push(entry);
            dailyForecasts.set(dateKey, forecast);
        }

        for (const { date, entries } of dailyForecasts.values()) {
            const day = document.createElement("section");
            day.className = "weather-day";
            const header = document.createElement("div");
            header.className = "weather-day-header";
            header.textContent = date.toLocaleDateString("no-NO", {
                weekday: "long",
                day: "numeric",
                month: "short"
            });
            const forecasts = document.createElement("div");
            forecasts.className = "weather-day-forecasts";

            for (let index = 0; index < entries.length; index += 4) {
                const period = entries.slice(index, index + 4);
                const entry = period[0];
                const item = document.createElement("div");
                item.className = "forecast-item";

                const start = new Date(entry.time);
                const end = new Date(period[period.length - 1].time);
                end.setHours(end.getHours() + 1);
                const timeOptions = {
                    hour: "2-digit",
                    minute: "2-digit",
                    hour12: false
                };
                const timeRange = `${start.toLocaleTimeString([], timeOptions)}–${end.toLocaleTimeString([], timeOptions)}`;
                const temperatures = period.map(({ temperature_c }) => Math.round(temperature_c));
                const lowestTemperature = Math.min(...temperatures);
                const highestTemperature = Math.max(...temperatures);
                const temperature = lowestTemperature === highestTemperature
                    ? `${lowestTemperature}°`
                    : `${lowestTemperature}–${highestTemperature}°`;

                item.innerHTML = `
                    <div class="icon">${entry.icon || "☀️"}</div>
                    <div class="time">${timeRange}</div>
                    <div class="temp">${temperature}</div>
                `;

                forecasts.appendChild(item);
            }

            day.append(header, forecasts);
            container.appendChild(day);
        }
    }

    function renderCalendar(calendar) {
        const container = document.getElementById("events");
        container.innerHTML = "";

        if (calendar && calendar.auth_required) {
            const prompt = document.createElement("div");
            prompt.className = "auth-prompt";
            prompt.innerHTML = `
                <p>${calendar.message || "Google Calendar authorization required."}</p>
                <button id="google-auth-button" type="button">Authorize Google Calendar</button>
            `;
            container.appendChild(prompt);
            document.getElementById("google-auth-button").addEventListener("click", startGoogleAuth);
            return;
        }

        const days = calendar?.days || [];
        const weekGrid = document.createElement("div");
        weekGrid.className = "week-grid";

        for (const day of days) {
            const group = document.createElement("div");
            group.className = "day-group";

            const header = document.createElement("div");
            header.className = "day-header";
            header.textContent = new Date(day.date).toLocaleDateString("no-NO", {
                weekday: "long",
                day: "2-digit",
                month: "2-digit"
            });
            group.appendChild(header);

            const dayEvents = document.createElement("div");
            dayEvents.className = "day-events";

            if (!day.events || day.events.length === 0) {
                const empty = document.createElement("div");
                empty.className = "no-events";
                empty.textContent = "Ingen hendelser";
                dayEvents.appendChild(empty);
            } else {
                for (const event of day.events) {
                    const item = document.createElement("div");
                    item.className = "event";

                    const time = event.start ? new Date(event.start).toLocaleTimeString("no-NO", {
                        hour: "2-digit",
                        minute: "2-digit",
                        hour12: false,
                        timeZone: "Europe/Oslo"
                    }) : "Hele dagen";

                    item.innerHTML = `
                        <strong>${event.title || "Untitled event"}</strong>
                        <div class="event-time">${time}</div>
                    `;

                    dayEvents.appendChild(item);
                }
            }

            group.appendChild(dayEvents);
            weekGrid.appendChild(group);
        }

        container.appendChild(weekGrid);
    }

    async function startGoogleAuth() {
        const response = await fetch("/api/oauth/google/config");
        if (!response.ok) {
            const message = await response.text();
            const details = message || "Google OAuth is not configured on the server.";
            document.getElementById("events").innerHTML = `
                <div class="auth-prompt">
                    <p>${details}</p>
                </div>
            `;
            return;
        }

        const config = await response.json();
        const params = new URLSearchParams({
            client_id: config.client_id,
            redirect_uri: config.redirect_uri,
            response_type: "code",
            scope: config.scope,
            access_type: "offline",
            prompt: "consent",
            include_granted_scopes: "true"
        });

        window.location.href = `https://accounts.google.com/o/oauth2/v2/auth?${params.toString()}`;
    }

    async function loadDashboard() {
        const response = await fetch("/api/dashboard");
        if (!response.ok) {
            throw new Error(`Dashboard request failed: ${response.status}`);
        }

        const data = await response.json();
        renderWeather(data.weather || {});
        renderCalendar(data.calendar || {});
    }

    updateClock();
    setInterval(updateClock, 1000);

    loadDashboard().catch(() => {
        document.getElementById("weather").textContent = "Weather unavailable.";
        document.getElementById("events").textContent = "Calendar unavailable.";
    });

    setInterval(loadDashboard, 15 * 60 * 1000);
</script>
</body>
</html>
